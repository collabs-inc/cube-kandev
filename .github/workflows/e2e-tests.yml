name: E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  isolated-projects:
    name: Isolated E2E (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [auth, routing]
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_ENABLE_AUTO_PIN: "0"
      NODE_OPTIONS: --dns-result-order=ipv4first
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out PR source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: e3c8aa3f18cad6bbad8e7f51448119bcde9993f8
          persist-credentials: false
      - name: Record tested revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Install dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile
      - name: Build and test isolated project
        working-directory: apps/web
        run: pnpm e2e:run --host --project "${{ matrix.project }}" -- --retries=0
      - name: Preserve test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-4088-isolated-${{ matrix.project }}
          path: apps/web/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
